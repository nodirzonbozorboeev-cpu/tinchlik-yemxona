<script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user && user.id === 8630108906) {
            document.getElementById('adminPanel').style.display = 'block';
        }

        let products = [
            { id: 1, name: "Bug'doy yemi (Premial)", price: 3500, unit: "kg" },
            { id: 2, name: "Makka yemi", price: 4200, unit: "kg" },
            { id: 3, name: "Kombiqorm", price: 180000, unit: "qop" }
        ];

        // Brauzer xotirasidan savatni o'qib olamiz
        let cart = JSON.parse(localStorage.getItem('tinchlik_cart')) || {};

        function saveCart() {
            localStorage.setItem('tinchlik_cart', JSON.stringify(cart));
        }

        function renderProducts() {
            const list = document.getElementById('productsList');
            list.innerHTML = '';
            
            products.forEach(p => {
                let currentQty = (cart[p.id] && cart[p.id].qty > 0) ? cart[p.id].qty : 0;
                let card = document.createElement('div');
                card.className = 'product-card';
                
                let controlHtml = '';
                if (p.unit === 'kg') {
                    controlHtml = `
                        <div class="qty-control">
                            <span style="font-size: 14px; color: #64748b;">Kg miqdori:</span>
                            <input type="number" class="kg-input" value="${currentQty > 0 ? currentQty : ''}" placeholder="0 kg" min="0" oninput="updateKgInput(${p.id}, this.value)">
                        </div>
                    `;
                } else {
                    controlHtml = `
                        <div class="qty-control">
                            <button class="btn-action" onclick="changeQop(${p.id}, -1)">-</button>
                            <span class="qop-count">${currentQty}</span> <span style="font-size: 14px; color: #64748b;">qop</span>
                            <button class="btn-action" onclick="changeQop(${p.id}, 1)">+</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>${p.price.toLocaleString()} so'm / ${p.unit}</p>
                    </div>
                    <div class="controls">
                        ${controlHtml}
                        ${user && user.id === 8630108906 ? `<button class="btn-danger" onclick="deleteProduct(${p.id})">O'chirish</button>` : ''}
                    </div>
                `;
                list.appendChild(card);
            });
            updateTotal();
        }

        function updateKgInput(id, val) {
            let qty = parseFloat(val);
            if (isNaN(qty) || qty <= 0) {
                delete cart[id];
            } else {
                if (!cart[id]) cart[id] = {};
                cart[id].qty = qty;
            }
            saveCart();
            updateTotal();
        }

        function changeQop(id, delta) {
            if (!cart[id]) {
                cart[id] = { qty: 0 };
            }
            cart[id].qty += delta;
            if (cart[id].qty < 0) {
                cart[id].qty = 0;
            }
            
            if (cart[id].qty === 0) {
                delete cart[id];
            }
            saveCart();
            renderProducts();
        }

        function updateTotal() {
            let total = 0;
            for (let id in cart) {
                let p = products.find(prod => prod.id == id);
                if (p && cart[id].qty > 0) {
                    total += p.price * cart[id].qty;
                }
            }
            document.getElementById('totalSum').innerText = total.toLocaleString();
        }

        function addProduct() {
            let title = document.getElementById('newTitle').value.trim();
            let price = parseFloat(document.getElementById('newPrice').value);
            let unit = document.getElementById('newUnit').value;

            if (!title || !price) {
                alert("Mahsulot nomi va narxini to'liq kiriting!");
                return;
            }

            let newProd = {
                id: Date.now(),
                name: title,
                price: price,
                unit: unit
            };
            products.push(newProd);
            renderProducts();

            document.getElementById('newTitle').value = '';
            document.getElementById('newPrice').value = '';
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            delete cart[id];
            saveCart();
            renderProducts();
        }

        function submitOrder() {
            let phone = document.getElementById('clientPhone').value.trim();
            if (!phone) {
                alert("Iltimos, siz bilan bog'lanishimiz uchun telefon raqamingizni kiriting!");
                document.getElementById('clientPhone').focus();
                return;
            }

            let items = [];
            let total = 0;

            for (let id in cart) {
                let p = products.find(prod => prod.id == id);
                if (p && cart[id].qty > 0) {
                    items.push({
                        name: p.name,
                        qty: cart[id].qty,
                        unit: p.unit,
                        price: p.price
                    });
                    total += p.price * cart[id].qty;
                }
            }

            if (items.length === 0) {
                alert("Savat bo'sh! Iltimos, mahsulot miqdorini tanlang.");
                return;
            }

            let orderData = {
                user_id: user ? user.id : 'unknown',
                user_name: user ? (user.first_name + (user.last_name ? ' ' + user.last_name : '')) : 'Hurmatli mijoz',
                phone: phone,
                items: items,
                total: total
            };

            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(data => {
                alert("Buyurtmangiz muvaffaqiyatli qabul qilindi! Tez orada siz bilan bog'lanamiz.");
                cart = {};
                localStorage.removeItem('tinchlik_cart');
                document.getElementById('clientPhone').value = '';
                renderProducts();
                tg.close();
            })
            .catch(err => {
                alert("Xatolik yuz berdi: " + err);
            });
        }

        renderProducts();
    </script>
