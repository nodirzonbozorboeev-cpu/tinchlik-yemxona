<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinchlik Yemxona - Rasmiy Do'kon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --primary-color: #27ae60;
            --button-hover: #219653;
            --danger-color: #e74c3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 140px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 { margin: 0; color: #2c3e50; font-size: 22px; }
        .header p { margin: 5px 0 0; color: #7f8c8d; font-size: 14px; }
        
        .product-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #eef2f7;
        }
        .product-info h3 { margin: 0 0 4px 0; font-size: 17px; color: #333; }
        .product-info p { margin: 0; color: #e67e22; font-weight: bold; font-size: 15px; }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button.btn-action {
            background-color: #3498db;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input.kg-input {
            width: 100px;
            text-align: center;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
        }
        .qop-count {
            font-size: 16px;
            font-weight: bold;
            min-width: 35px;
            text-align: center;
            color: #1e293b;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            padding: 15px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid #e2e8f0;
            border-radius: 20px 20px 0 0;
        }
        .phone-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .phone-input:focus { border-color: #3498db; }
        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-price {
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
        }
        button.btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }
        button.btn-submit:active { background-color: var(--button-hover); }
        button.btn-submit:disabled {
            background-color: #bdc3c7;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🌾 Tinchlik Yemxona</h2>
        <p>Sifatli va hamyonbop yem-hasak mahsulotlari</p>
    </div>

    <div id="productsList"></div>

    <div class="cart-bar">
        <input type="tel" id="clientPhone" class="phone-input" placeholder="📞 Telefon raqamingiz (+998 90 123 45 67)" oninput="checkPhone()">
        <div class="cart-row">
            <div class="total-price">
                Jami: <span id="totalSum">0</span> so'm
            </div>
            <button class="btn-submit" id="submitBtn" onclick="submitOrder()" disabled>Buyurtma berish 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        // Barcha mahsulotlar o'zgarmas bazasi (Siz yuborgan ma'lumotlar asosida)
        const products = [
            { id: 1, name: "Kepak Motabar (25kg qop)", price: 85000, unit: "qop" },
            { id: 2, name: "Kepak Mayda (25kg qop)", price: 85000, unit: "qop" },
            { id: 3, name: "MasterFeed (Buqalar uchun - 40kg qop)", price: 200000, unit: "qop" },
            { id: 4, name: "MasterFeed (Qoylar uchun - 40kg qop)", price: 200000, unit: "qop" },
            { id: 5, name: "MasterFeed (Sigirlar uchun - 40kg qop)", price: 225000, unit: "qop" },
            { id: 6, name: "MasterFeed (Quyonlar uchun)", price: 6000, unit: "kg" },
            { id: 7, name: "MasterFeed (Broyler 1,2,3)", price: 10000, unit: "kg" },
            { id: 8, name: "ArganicFeed (Buqa va Sigirlar uchun - 40kg qop)", price: 175000, unit: "qop" },
            { id: 9, name: "Xusnidin Chorvador (Buqalar uchun - 40kg)", price: 240000, unit: "qop" },
            { id: 10, name: "Silyos (20kg qop)", price: 18000, unit: "qop" },
            { id: 11, name: "Kunjara", price: 6500, unit: "kg" },
            { id: 12, name: "Raps Shrot", price: 6000, unit: "kg" },
            { id: 13, name: "Mayda Tuz (1kg pachka)", price: 2000, unit: "dona" },
            { id: 14, name: "Vitamin tuz", price: 12000, unit: "dona" },
            { id: 15, name: "Makka Jo'xori", price: 4000, unit: "kg" },
            { id: 16, name: "Arpa", price: 4000, unit: "kg" },
            { id: 17, name: "Bug'doy", price: 4500, unit: "kg" },
            { id: 18, name: "555 Omuxta yem (Qo'ylar uchun)", price: 5000, unit: "kg" },
            { id: 19, name: "555 Omuxta yem (Tovuqlar uchun)", price: 5000, unit: "kg" }
        ];

        let cart = {};

        function renderProducts() {
            const list = document.getElementById('productsList');
            list.innerHTML = '';
            
            products.forEach(p => {
                let currentQty = (cart[p.id] && cart[p.id] > 0) ? cart[p.id] : 0;
                let card = document.createElement('div');
                card.className = 'product-card';
                
                let controlHtml = '';
                if (p.unit === 'kg' || p.unit === 'dona') {
                    controlHtml = `
                        <div class="qty-control">
                            <span style="font-size: 14px; color: #64748b;">Miqdori (${p.unit}):</span>
                            <input type="number" class="kg-input" value="${currentQty > 0 ? currentQty : ''}" placeholder="0" min="0" oninput="updateKgInput(${p.id}, this.value)">
                        </div>
                    `;
                } else {
                    controlHtml = `
                        <div class="qty-control">
                            <button class="btn-action" onclick="changeQop(${p.id}, -1)">-</button>
                            <span class="qop-count">${currentQty}</span> <span style="font-size: 14px; color: #64748b;">qop</span>
                            <button class="btn-action" onclick="changeQop(${p.id}, 1)">+</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>${p.price.toLocaleString()} so'm / ${p.unit}</p>
                    </div>
                    <div class="controls">
                        ${controlHtml}
                    </div>
                `;
                list.appendChild(card);
            });
            updateTotal();
        }

        function updateKgInput(id, val) {
            let qty = parseFloat(val);
            if (isNaN(qty) || qty <= 0) {
                delete cart[id];
            } else {
                cart[id] = qty;
            }
            updateTotal();
        }

        function changeQop(id, delta) {
            if (!cart[id]) {
                cart[id] = 0;
            }
            cart[id] += delta;
            if (cart[id] < 0) {
                cart[id] = 0;
            }
            if (cart[id] === 0) {
                delete cart[id];
            }
            renderProducts();
        }

        function updateTotal() {
            let total = 0;
            for (let id in cart) {
                let p = products.find(prod => prod.id == id);
                if (p && cart[id] > 0) {
                    total += p.price * cart[id];
                }
            }
            document.getElementById('totalSum').innerText = total.toLocaleString();
        }

        function checkPhone() {
            let phone = document.getElementById('clientPhone').value.trim();
            let btn = document.getElementById('submitBtn');
            if (phone.length >= 9) {
                btn.removeAttribute('disabled');
            } else {
                btn.setAttribute('disabled', 'true');
            }
        }

        function submitOrder() {
            let phone = document.getElementById('clientPhone').value.trim();
            if (!phone) {
                alert("Iltimos, telefon raqamingizni kiriting!");
                return;
            }

            let items = [];
            let total = 0;

            for (let id in cart) {
                let p = products.find(prod => prod.id == id);
                if (p && cart[id] > 0) {
                    items.push({
                        name: p.name,
                        qty: cart[id],
                        unit: p.unit,
                        price: p.price
                    });
                    total += p.price * cart[id];
                }
            }

            if (items.length === 0) {
                alert("Savat bo'sh! Mahsulot tanlang.");
                return;
            }

            let orderData = {
                user_id: user ? user.id : 'unknown',
                user_name: user ? (user.first_name + (user.last_name ? ' ' + user.last_name : '')) : 'Hurmatli mijoz',
                phone: phone,
                items: items,
                total: total
            };

            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(data => {
                alert("Buyurtmangiz muvaffaqiyatli qabul qilindi! Sotuvchi 5 daqiqa ichida siz bilan bog'lanadi.");
                cart = {};
                document.getElementById('clientPhone').value = '';
                checkPhone();
                renderProducts();
                tg.close();
            })
            .catch(err => {
                alert("Xatolik yuz berdi: " + err);
            });
        }

        renderProducts();
    </script>
</body>
</html>
