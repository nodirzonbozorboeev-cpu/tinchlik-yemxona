<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinchlik Yemxona</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-28">

    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🌾 Tinchlik Yemxona</h1>
            <span id="cart-count" class="bg-white text-emerald-600 text-xs font-bold px-2 py-1 rounded-full">0 ta</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        <div id="product-list" class="space-y-4">
            <!-- Mahsulotlar yuklanmoqda -->
        </div>
    </main>

    <!-- Savatcha paneli -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end">
        <div class="bg-white w-full rounded-t-2xl p-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">🛒 Sizning savatchangiz</h2>
                <button onclick="toggleCart()" class="text-gray-500 font-bold text-xl">&times;</button>
            </div>
            
            <div id="cart-items" class="space-y-3 mb-4"></div>

            <div class="border-t pt-3 space-y-3">
                <div class="flex justify-between font-bold text-lg">
                    <span>Jami:</span>
                    <span id="total-price">0 so'm</span>
                </div>

                <input type="text" id="phone" placeholder="Telefon raqamingiz (+998 ...)" class="w-full p-3 border rounded-xl">
                <input type="text" id="address" placeholder="Yetkazish manzili (MFY, ko'cha...)" class="w-full p-3 border rounded-xl">

                <button onclick="checkout()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold shadow-lg">Buyurtmani tasdiqlash</button>
            </div>
        </div>
    </div>

    <!-- Pastki tugma -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Umumiy summa:</p>
                <p id="footer-total" class="text-lg font-bold text-emerald-600">0 so'm</p>
            </div>
            <button onclick="toggleCart()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow">Savatchani ko'rish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let products = [];
        let cart = {};

        async function fetchProducts() {
            try {
                // Muhim: Brauzer keshida saqlanib qolmasligi uchun vaqt qo'shamiz
                let response = await fetch('products.json?t=' + new Date().getTime());
                products = await response.json();
                renderProducts();
            } catch (error) {
                console.error("Xatolik:", error);
            }
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            if (!products || products.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-gray-500"><p class="text-lg font-semibold">🌾 Hozircha mahsulotlar mavjud emas</p></div>`;
                return;
            }

            products.forEach(p => {
                let qty = cart[p.id] ? cart[p.id].qty : 0;
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between border border-gray-100 mb-3">
                        <div>
                            <h3 class="font-bold text-lg">${p.name}</h3>
                            <p class="text-emerald-600 font-semibold">${p.price.toLocaleString()} so'm / dona</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQty(${p.id}, -1)" class="w-8 h-8 bg-gray-100 rounded-lg font-bold">-</button>
                            <span class="w-6 text-center font-bold">${qty}</span>
                            <button onclick="changeQty(${p.id}, 1)" class="w-8 h-8 bg-emerald-600 text-white rounded-lg font-bold">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeQty(id, delta) {
            if (!cart[id]) {
                if (delta > 0) {
                    let p = products.find(item => item.id === id);
                    cart[id] = { ...p, qty: 1 };
                }
            } else {
                cart[id].qty += delta;
                if (cart[id].qty <= 0) delete cart[id];
            }
            updateCartUI();
            renderProducts();
        }

        function updateCartUI() {
            let totalItems = 0;
            let totalPrice = 0;
            let cartItemsEl = document.getElementById('cart-items');
            cartItemsEl.innerHTML = '';

            for (let id in cart) {
                let item = cart[id];
                totalItems += item.qty;
                totalPrice += item.price * item.qty;
                cartItemsEl.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2">
                        <div>
                            <p class="font-bold">${item.name}</p>
                            <p class="text-sm text-gray-500">${item.qty} dona x ${item.price.toLocaleString()} so'm</p>
                        </div>
                        <p class="font-bold">${(item.qty * item.price).toLocaleString()} so'm</p>
                    </div>
                `;
            }

            document.getElementById('cart-count').innerText = `${totalItems} ta`;
            document.getElementById('total-price').innerText = `${totalPrice.toLocaleString()} so'm`;
            document.getElementById('footer-total').innerText = `${totalPrice.toLocaleString()} so'm`;
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function checkout() {
            let phone = document.getElementById('phone').value;
            let address = document.getElementById('address').value;

            if (!phone || !address) {
                alert("Iltimos, telefon raqam va manzilni kiriting!");
                return;
            }

            let items = Object.values(cart);
            if (items.length === 0) {
                alert("Savatchangiz bo'sh!");
                return;
            }

            let totalPrice = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

            let data = {
                items: items,
                totalPrice: totalPrice,
                phone: phone,
                address: address
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        fetchProducts();
    </script>
</body>
</html>
